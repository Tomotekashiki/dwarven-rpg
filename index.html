<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dwarven RPG">
    <meta name="theme-color" content="#06080e">
    <meta name="mobile-web-app-capable" content="yes">

    <title>Dwarven RPG v1.0.0 (Mobile PWA)</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">

    <link rel="stylesheet" href="style.css">

    <!-- Preload critical WASM and SWF game assets for ultra-fast startup -->
    <link rel="preload" href="ruffle/core.ruffle.15317142e75ce021ac04.js" as="script">
    <link rel="preload" href="ruffle/6ce4f603a1fe7cc88438.wasm" as="fetch" type="application/wasm" crossorigin>
    <link rel="preload" href="game.swf" as="fetch" crossorigin>

    <!-- Global Ruffle Config MUST precede ruffle.js script tag -->
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            publicPath: "./ruffle/",
            autoplay: "auto",
            unmuteOverlay: "visible",
            letterbox: "on",
            quality: "low",
            scale: "showAll",
            forceScale: false,
            splashScreen: false,
            openUrlMode: "confirm",
            allowScriptAccess: true,
            preferredRenderer: "webgl",
            backgroundExecutionMode: "mainThread"
        };
    </script>
    <script src="ruffle/ruffle.js"></script>
</head>
<body>
    <!-- Diagnostic error banner for mobile debugging -->
    <div id="error-log"></div>

    <div id="app-container">
        <div id="player-container"></div>
        
        <div id="ui-bar">
            <button id="dpad-toggle-btn" class="ui-btn active" title="Toggle Virtual D-Pad">🕹️ D-Pad</button>
            <button id="renderer-btn" class="ui-btn" title="Toggle WebGL/Canvas">🎨 WebGL</button>
            <button id="fullscreen-btn" class="ui-btn" title="Toggle Fullscreen">⛶ Fullscreen</button>
        </div>

        <!-- Virtual D-Pad for Mobile Controls -->
        <div id="virtual-dpad">
            <div class="dpad-cross">
                <button class="dpad-btn dpad-up" data-dir="up" aria-label="Up">▲</button>
                <button class="dpad-btn dpad-left" data-dir="left" aria-label="Left">◀</button>
                <div class="dpad-center"></div>
                <button class="dpad-btn dpad-right" data-dir="right" aria-label="Right">▶</button>
                <button class="dpad-btn dpad-down" data-dir="down" aria-label="Down">▼</button>
            </div>
        </div>

        <div id="version-badge">v1.0.0</div>
    </div>

    <!-- Start / Audio Unlock Overlay for iOS & Mobile Safari -->
    <div id="start-overlay">
        <div class="start-box">
            <img src="favicon.png" class="start-logo" alt="Lineage II Dwarf">
            <h1>Dwarven RPG</h1>
            <p>Lineage II Mini-Game</p>

            <div id="loading-spinner" class="spinner"></div>
            <div id="progress-bar-wrap">
                <div id="progress-bar-fill"></div>
            </div>

            <button id="start-game-btn" class="loading-state" disabled>⏳ იტვირთება...</button>
            <div id="status-text">გთხოვთ დაელოდოთ, თამაში მზადდება...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
