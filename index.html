<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dwarven RPG">
    <meta name="theme-color" content="#06080e">
    <meta name="mobile-web-app-capable" content="yes">

    <title>Dwarven RPG v1.0.0 (Mobile PWA)</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">

    <link rel="stylesheet" href="style.css">
    <script src="ruffle/ruffle.js"></script>
</head>
<body>
    <div id="app-container">
        <div id="player-container"></div>
        
        <div id="ui-bar">
            <button id="fullscreen-btn" class="ui-btn" title="Toggle Fullscreen">⛶ Fullscreen</button>
        </div>

        <div id="version-badge">v1.0.0</div>
    </div>

    <!-- Rotate Device Prompt for Portrait Mode -->
    <div id="rotate-hint">
        <div class="rotate-icon">📱 ➔ 🔄</div>
        <h2>გადააბრუნეთ ტელეფონი</h2>
        <p>საუკეთესო გამოცდილებისთვის დაიკავეთ ჰორიზონტალურად (Landscape)</p>
        <button id="dismiss-rotate-btn">მაინც გაგრძელება</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
